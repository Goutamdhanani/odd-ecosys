<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cold Email Outreach Ecosystem — CRM Control Plane. 9-phase AI-assisted B2B outreach pipeline dashboard with lead kanban, mailbox health scoring, A/B testing, and batch cohort engine.">
  <title>oddecosys — Your outreach, in orbit</title>

  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/observatory.css">
  <link rel="stylesheet" href="css/lists.css">
  <link rel="stylesheet" href="css/campaign-audience.css">
  <link rel="stylesheet" href="css/campaign-sequence.css">
  <link rel="stylesheet" href="css/inbox.css">
  <link rel="stylesheet" href="css/contact-edit.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/lead-strategy.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to workspace</a>
  <div class="ambient-mesh" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="ambient-orb orb-4"></div>
  </div>

  <div id="app">
    <!-- Built by app.js -->
    <div class="app-loading-screen">
      <div class="apple-glass-spinner-box">
        <div class="apple-logo-badge"><img src="assets/odd-ecosys-emblem.png" alt=""></div>
        <div class="apple-loading-spinner"></div>
      </div>
      <div class="apple-loading-text">Bringing your workspace into view…</div>
    </div>
  </div>

  <script>
    if (window.location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', () => {
        const app = document.getElementById('app');
        if (app) {
          app.innerHTML = `
            <div style="display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:20px;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#08090d;color:#f1f5f9">
              <div style="width:48px;height:48px;background:linear-gradient(135deg,#ff9f0a,#ff453a);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 24px rgba(255,159,10,0.3)">⚠️</div>
              <h2 style="font-size:1.25rem;font-weight:700">HTTP Local Server Required</h2>
              <p style="max-width:480px;font-size:0.875rem;color:#8e8e93;line-height:1.6">
                Modern web browsers block JavaScript ES Modules when opened directly via <code style="color:#ff9f0a;background:rgba(255,159,10,0.15);padding:2px 6px;border-radius:6px">file://</code> protocol due to CORS security rules.
              </p>
              <div style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px);border-radius:12px;padding:16px 20px;text-align:left;font-family:monospace;font-size:0.85rem;color:#64d2ff">
                <div># Run this command in your project directory:</div>
                <div style="color:#30d158;font-weight:bold;margin-top:6px">npm start</div>
                <div style="color:#8e8e93;font-size:0.75rem;margin-top:8px">Then open: http://localhost:3000</div>
              </div>
            </div>
          `;
        }
      });
    }
  </script>

  <!-- ES module entry point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
